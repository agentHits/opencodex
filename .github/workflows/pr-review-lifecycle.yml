name: PR review lifecycle

on:
  pull_request_review:
    types: [submitted]

# The workflow and script are loaded from the repository default branch. It
# reads review/PR metadata only and never checks out the pull request head.
# Least privilege: no default permissions; the lifecycle job grants only what it needs.
permissions: {}

concurrency:
  group: pr-review-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    # issues/pull-requests write maintain the review-round and closure labels;
    # PR label writes require pull-requests: write (see pr-labeler.yml).
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted lifecycle script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Track substantial review rounds
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const path = require("node:path");
            const {
              CLOSURE_LABELS,
              MAX_SUBSTANTIAL_REVIEW_ROUNDS,
              applyReviewEvent,
            } = require(
              path.join(process.cwd(), ".github", "scripts", "pr-review-lifecycle.cjs"),
            );
            const { authorHasPushPermission } = require(
              path.join(process.cwd(), ".github", "scripts", "pr-quality.cjs"),
            );

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const review = context.payload.review;
            const pull_number = pr.number;
            const marker = "<!-- pr-review-lifecycle -->";
            const statePattern = /<!-- pr-review-lifecycle-state:([^]*?) -->/;

            let reviewerPermission = "read";
            try {
              const response = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: review.user.login,
              });
              reviewerPermission = response.data.permission;
            } catch (error) {
              core.warning(`Reviewer permission lookup failed: ${error.message}`);
            }
            const reviewerHasPushPermission = authorHasPushPermission(reviewerPermission);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker),
            );
            let storedState = null;
            const match = existing?.body?.match(statePattern);
            if (match) {
              try { storedState = JSON.parse(match[1]); }
              catch (error) { core.warning(`Could not parse lifecycle state: ${error.message}`); }
            }

            const result = applyReviewEvent({
              state: storedState,
              reviewState: review.state,
              reviewBody: review.body,
              reviewerHasPushPermission,
              headSha: pr.head.sha,
            });
            // An approval supersedes prior rounds: clear the round and limit
            // labels so an approved PR is not still labeled as review churn.
            if (String(review.state || "").toLowerCase() === "approved") {
              const currentLabels = new Set(pr.labels.map((label) => label.name));
              for (const name of [
                "review: round-1",
                "review: round-2",
                "review: limit-reached",
              ]) {
                if (currentLabels.has(name)) {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: pull_number, name,
                  });
                }
              }
              core.info("Approval clears review-round labels.");
              return;
            }

            if (!result.counted) {
              core.info("Review did not start a new substantial maintainer review round.");
              return;
            }

            const labels = {
              "review: round-1": ["bfdadc", "One substantial maintainer review round completed"],
              "review: round-2": ["d4c5f9", "Two substantial maintainer review rounds completed"],
              "review: limit-reached": ["b60205", "Review churn threshold reached; maintainer disposition required"],
              ...Object.fromEntries(CLOSURE_LABELS.map((name) => [name, ["5319e7", "Standard pull request closure reason"]])),
            };

            async function ensureLabel(name) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                const [color, description] = labels[name];
                try {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            }
            for (const name of Object.keys(labels)) await ensureLabel(name);

            const current = new Set(pr.labels.map((label) => label.name));
            async function add(name) {
              if (current.has(name)) return;
              await github.rest.issues.addLabels({ owner, repo, issue_number: pull_number, labels: [name] });
              current.add(name);
            }
            async function remove(name) {
              if (!current.has(name)) return;
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name });
              current.delete(name);
            }

            await remove("review: round-1");
            await remove("review: round-2");
            await add(`review: round-${Math.min(result.rounds, MAX_SUBSTANTIAL_REVIEW_ROUNDS)}`);
            if (result.limitReached) await add("review: limit-reached");

            const stateMarker = `<!-- pr-review-lifecycle-state:${JSON.stringify({
              version: result.version,
              rounds: result.rounds,
              lastCountedHeadSha: result.lastCountedHeadSha,
            })} -->`;
            const limitText = result.limitReached
              ? [
                  "",
                  "The two-round review threshold is reached. If the implementation still needs architectural repair, repeatedly reintroduces defects, or cannot be explained by the author, a maintainer may close it with `close: excessive-review-churn`. The author may return with a clean replacement PR.",
                ]
              : ["", "Address the requested changes on the branch. Maintainers are not expected to implement or debug the fixes for the author."];
            const body = [
              marker,
              stateMarker,
              "",
              `🔁 **Substantial maintainer review round ${result.rounds} recorded.**`,
              ...limitText,
            ].join("\n");

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
            }
